<!doctype html>
<html lang="en">
<head>
{% include head.html %}
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/work/' | relative_url }}">Work</a>
        <a href="{{ '/writing/' | relative_url }}">Writing</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/reading/' | relative_url }}">Reading</a>
        {% if site.resume != "" %}<a href="{{ site.resume | relative_url }}">Resume</a>{% endif %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>© {{ site.time | date: "%Y" }} {{ site.title }}</span>
      <span class="footer-links">
        <a href="mailto:{{ site.email }}">Email</a>
        <a href="{{ site.linkedin }}">LinkedIn</a>
      </span>
    </div>
  </footer>
</body>
</html>
