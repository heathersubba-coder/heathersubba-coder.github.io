---
layout: default
---
<article class="narrow">
  <p class="eyebrow"><a href="{{ '/writing/' | relative_url }}">Writing</a> · {{ page.date | date: "%B %-d, %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
